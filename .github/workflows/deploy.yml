name: CI/CD - Credit Risk API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; jobs opt in to anything more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run linting
        run: |
          black --check .
          flake8 . --max-line-length=100 --ignore=E203,W503

      - name: Run type checking
        run: mypy . --ignore-missing-imports

      - name: Run tests with coverage
        run: pytest -v --cov=app --cov-fail-under=90

  docker-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t credit-risk-api:test .

      - name: Run Trivy (SARIF report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: credit-risk-api:test
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Fork pull requests get a read-only token and cannot upload SARIF.
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy (fail on fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: credit-risk-api:test
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  build-and-push:
    # Deploy only after tests AND the image scan have passed.
    needs: [test, docker-security]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # id-token lets this job (and only this job) log in to Azure via OIDC.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Docker Hub push (keeps your public image)
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image to Docker Hub
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            thaitri2005/credit_scorecard_for_default_prediction:latest
            thaitri2005/credit_scorecard_for_default_prediction:${{ github.sha }}

      # Azure Container Registry push
      # OIDC login: Azure trusts runs from this repo's main branch through a
      # federated credential, so there is no client secret to expire.
      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name creditscorecardwoeiv

      # Reuse the image built above so both registries hold identical bits.
      - name: Push image to ACR
        run: |
          docker pull thaitri2005/credit_scorecard_for_default_prediction:${{ github.sha }}
          docker tag thaitri2005/credit_scorecard_for_default_prediction:${{ github.sha }} creditscorecardwoeiv.azurecr.io/credit-risk-api:${{ github.sha }}
          docker tag thaitri2005/credit_scorecard_for_default_prediction:${{ github.sha }} creditscorecardwoeiv.azurecr.io/credit-risk-api:latest
          docker push creditscorecardwoeiv.azurecr.io/credit-risk-api:${{ github.sha }}
          docker push creditscorecardwoeiv.azurecr.io/credit-risk-api:latest

      # Deploy the immutable commit tag so the Web App always pulls the new
      # image and a rollback is just a redeploy of an older tag.
      - name: Deploy to Azure Web App
        run: |
          az webapp config container set \
            --name creditscorecardwoeiv \
            --resource-group docker-fastapi-credit-scorecard \
            --container-image-name creditscorecardwoeiv.azurecr.io/credit-risk-api:${{ github.sha }} \
            --container-registry-url https://creditscorecardwoeiv.azurecr.io
