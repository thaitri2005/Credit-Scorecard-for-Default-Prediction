services:
  credit-risk-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # The container listens on port 80 (see Dockerfile).
      - "8000:80"
    environment:
      - LOG_LEVEL=INFO
      - DEBUG=false
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:80/api/v1/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
